[project]
name = "lob-modeling"
version = "0.3.0"
description = "LOB Modeling - Market making algorithms with interactive webapp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core numerical & scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    
    # Data visualization
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    
    # External data
    "yfinance>=0.2.0",
    
    # Webapp (FastAPI)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    
    # Linting & formatting
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "pydocstyle>=6.3.0",
    
    # Type checking
    "mypy>=1.8.0",
    
    # Testing utilities
    "httpx>=0.26.0",
]

webapp = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_modeling"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["frontend/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = ["frontend"]

[tool.coverage.run]
source = ["src/lob_modeling"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
